name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: flake check
        run: nix flake check --print-build-logs
      - name: build khion
        run: nix build .#nixosConfigurations.khion.config.system.build.toplevel --print-out-paths
      - name: build lumi
        run: nix build .#nixosConfigurations.lumi.config.system.build.toplevel --print-out-paths
