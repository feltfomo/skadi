SectionVerb {
    EnableSequence [
        disdevall ""
        cset "name='Speaker Switch' off"
        cset "name='Headphone Switch' off"
        cset "name='Headset Mic Switch' off"
        cset "name='Internal Mic Switch' off"
        cset "name='HPVol SPKVol Switch' 3"
        cset "name='HPL Playback Volume' 191"
        cset "name='HPR Playback Volume' 191"
        cset "name='SPKL Playback Volume' 191"
        cset "name='SPKR Playback Volume' 191"
    ]
}

SectionDevice."Speaker" {
    Comment "Speakers"
    ConflictingDevice [ "Headphones" ]
    EnableSequence [ cset "name='Speaker Switch' on" ]
    DisableSequence [ cset "name='Speaker Switch' off" ]
    Value {
        PlaybackPriority 100
        PlaybackPCM "hw:${CardId}"
        PlaybackChannels 2
    }
}

SectionDevice."Headphones" {
    Comment "Headphones"
    ConflictingDevice [ "Speaker" ]
    EnableSequence [ cset "name='Headphone Switch' on" ]
    DisableSequence [ cset "name='Headphone Switch' off" ]
    Value {
        PlaybackPriority 300
        PlaybackPCM "hw:${CardId}"
        PlaybackChannels 2
        JackControl "Headphone Jack"
        JackHWMute "Speaker"
    }
}

SectionDevice."Mic" {
    Comment "Analog Microphone"
    ConflictingDevice [ "Headset" ]
    EnableSequence [ cset "name='Internal Mic Switch' on" ]
    DisableSequence [ cset "name='Internal Mic Switch' off" ]
    Value {
        CapturePriority 100
        CapturePCM "hw:${CardId}"
        CaptureMixerElem "ADC PGA Gain"
        CaptureMasterElem "ADC"
    }
}

SectionDevice."Headset" {
    Comment "Headset Microphone"
    ConflictingDevice [ "Mic" ]
    EnableSequence [ cset "name='Headset Mic Switch' on" ]
    DisableSequence [ cset "name='Headset Mic Switch' off" ]
    Value {
        CapturePriority 300
        CapturePCM "hw:${CardId}"
        CaptureMixerElem "ADC PGA Gain"
        CaptureMasterElem "ADC"
        JackControl "Headset Mic Jack"
    }
}

Include.hdmi.File "/Intel/sof-essx8336/Hdmi.conf"
