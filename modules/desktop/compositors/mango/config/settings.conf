# keyboard
repeat_rate=40
repeat_delay=300
xkb_rules_layout=us
numlock_on=1

# focus
focus_on_activate=1
sloppy_focus=1
warp_cursor=1

# xwayland + gaming. syncobj helps stutter but crashes kitty on some gpus;
# if that hits, uncomment WLR_DRM_NO_ATOMIC in environment-khion.conf and relogin
xwayland_persistence=1
sync_obj_enable=1

# borders + gaps
border_px=2
gap_inner_horizontal=5
gap_inner_vertical=5
gap_outer_horizontal=15
gap_outer_vertical=15

# cursor
cursor_size=24

# screenshot editor
window_rule=is_floating:1,app_id:satty

# named scratchpads follow the focused monitor and use relative sizing
scratchpad_cross_monitor=1
scratchpad_width_ratio=0.8
scratchpad_height_ratio=0.75
window_rule=is_named_scratchpad:1,width:0.65,height:0.65,animation_type_open:slide,animation_type_close:slide,app_id:spotify
window_rule=is_named_scratchpad:1,width:0.65,height:0.65,animation_type_open:slide,animation_type_close:slide,app_id:thunar
window_rule=is_named_scratchpad:1,width:0.65,height:0.65,animation_type_open:slide,animation_type_close:slide,app_id:dev.noctalia.Noctalia,title:Noctalia Settings

# scrollers
scroller_structs=20
edge_scroller_pointer_focus=0
scroller_default_proportion=1.0
scroller_ignore_proportion_single=0
