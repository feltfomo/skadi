# main entry — mango loads ~/.config/mango/config.conf by default. edit the
# sourced files, not this one. colors.conf is rendered by noctalia from the
# active palette; source-optional skips it on a cold start before noctalia has
# run, and noctalia's post_hook reloads config once it's written.
source=~/.config/mango/settings.conf
source=~/.config/mango/environment.conf
source-optional=~/.config/mango/environment-khion.conf
source-optional=~/.config/mango/monitors-khion.conf
source-optional=~/.config/mango/monitors-lumi.conf
source=~/.config/mango/autostart.conf
source=~/.config/mango/binds.conf
source-optional=~/.config/mango/colors.conf

blur=1
blur_layer=0
blur_params_radius=5
blur_params_num_passes=2
focused_opacity=0.8
unfocused_opacity=0.8
