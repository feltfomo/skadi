# keyboard
repeat_rate=40
repeat_delay=300
xkb_rules_layout=us
numlockon=1

# focus
focus_on_activate=1
sloppyfocus=1
warpcursor=1

# xwayland + gaming. syncobj helps stutter but crashes kitty on some gpus;
# if that hits, uncomment WLR_DRM_NO_ATOMIC in environment-khion.conf and relogin
xwayland_persistence=1
syncobj_enable=1

# borders + gaps
borderpx=2
gappih=5
gappiv=5
gappoh=15
gappov=15

# cursor
cursor_size=24
