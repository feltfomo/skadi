# noctalia shell + clipboard history
exec-once=noctalia
exec-once=wl-paste --type text --watch cliphist store
exec-once=wl-paste --type image --watch cliphist store

# wlr portal for screen sharing (mangowm handles dbus activation itself,
# don't add the old dbus-update-activation-environment line)
exec-once=xdg-desktop-portal-wlr

# TODO: launch always-open apps onto tags 1-4 (zen-twilight, spotify, equibop,
# steam) once tagrules are wired — mangowm assigns apps to tags via windowrule,
# not a spawn-on-workspace flag like hyprland