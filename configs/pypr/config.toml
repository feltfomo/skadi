[pyprland]
plugins = ["scratchpads", "fetch_client_menu"]

[fetch_client_menu]
# fetched windows float and land in the middle of the focused monitor
engine = "fuzzel"
center_on_fetch = true
margin = 60

[scratchpads.centered]
lazy = true
animation = "fromTop"
size = "100% 70%"
max_size = "1600px 100%"
# A 70% height leaves 15% on either side on the configured 1440p and 1080p monitors.
margin = 216

[scratchpads.centered.monitor.eDP-1]
margin = 162

[scratchpads.spotify]
use = "centered"
command = "spotify"
class = "spotify"

[scratchpads.thunar]
use = "centered"
command = "thunar"
class = "thunar"

[scratchpads.settings]
use = "centered"
command = "noctalia msg settings-open"
class = "dev.noctalia.Noctalia"
match_by = "title"
title = "Noctalia Settings"
# The shell owns the settings window; the IPC command exits after opening it.
process_tracking = false
