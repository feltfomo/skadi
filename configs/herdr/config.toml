[[keys.command]]
key = "prefix+f"
type = "plugin_action"
command = "javoscript.herdr-pickr.panes-all"
description = "find pane"

[[keys.command]]
key = "prefix+e"
type = "plugin_action"
command = "chmarax.herdr-nvim.toggle"
description = "nvim sidebar"

[[keys.command]]
key = "prefix+o"
type = "plugin_action"
command = "chmarax.herdr-nvim.pick-file"
description = "open file from agent output"
